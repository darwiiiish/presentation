<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sustainability: A Royal Presentation</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        royal: {
                            light: '#fdfbf7', // Very light cream
                            gold: '#c5a059',  // Soft elegant gold
                            dark: '#1a202c',  // Deep slate
                            gray: '#4a5568'
                        }
                    },
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        sans: ['"Inter"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-royal-light text-royal-dark font-sans overflow-hidden">
    <!-- Progress Bar -->
    <div class="fixed top-0 left-0 w-full h-1 z-50 bg-royal-dark/10">
        <div id="progress-bar" class="h-full bg-royal-gold transition-all duration-300" style="width: 0%"></div>
    </div>

    <!-- Presentation Container with Snap Scrolling -->
    <div id="presentation-container" class="h-screen w-full overflow-y-scroll snap-y snap-mandatory hide-scrollbar relative">
        <!-- Slides will be injected here by app.js -->
    </div>

    <script src="slides-data.js"></script>
    <script src="app.js"></script>
</body>
</html>
